<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>KisanAI — Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .card{background:white;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,0.12);width:100%;max-width:420px;overflow:hidden;}
    .card-top{background:linear-gradient(135deg,#1a3a1f,#2e7d32);padding:2.5rem 2rem;text-align:center;color:white;}
    .card-top h1{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;margin:.5rem 0 .2rem;}
    .card-top p{opacity:.8;font-size:.9rem;margin:0;}
    .card-body{padding:2rem;}
    .tabs{display:flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.5rem;}
    .tab{flex:1;padding:.65rem;border:none;background:transparent;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--text-muted);transition:.2s;}
    .tab.on{background:var(--green-mid);color:white;}
    .section{display:none;} .section.on{display:block;}
    .err{background:#ffebee;color:#c62828;border-radius:8px;padding:.65rem 1rem;font-size:.85rem;margin-bottom:.85rem;display:none;}
    .suc{background:var(--green-pale);color:var(--green-deep);border-radius:8px;padding:.65rem 1rem;font-size:.85rem;margin-bottom:.85rem;display:none;}
    .pwd-wrap{position:relative;}
    .pwd-wrap input{padding-right:2.8rem;}
    .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text-muted);}
    .bar{height:4px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden;}
    .bar-fill{height:100%;border-radius:99px;transition:all .3s;}
    .req{list-style:none;padding:0;margin:.5rem 0 0;}
    .req li{font-size:.75rem;display:flex;align-items:center;gap:5px;margin:2px 0;color:var(--text-muted);}
    .req li.ok{color:var(--green-mid);}
    .forgot-link{text-align:center;margin-top:.75rem;}
    .forgot-link button{background:none;border:none;color:var(--green-mid);font-size:.85rem;cursor:pointer;font-weight:600;}
    .back-btn{background:none;border:none;color:var(--text-muted);font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:1rem;padding:0;}
    .back-btn:hover{color:var(--green-mid);}
  </style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div style="font-size:3rem;">🌱</div>
    <h1>KisanAI</h1>
    <p>Smart Agriculture Assistant</p>
  </div>
  <div class="card-body">

    <!-- TABS -->
    <div class="tabs" id="mainTabs">
      <button class="tab on" onclick="show('login')">Login</button>
      <button class="tab" onclick="show('signup')">Sign Up</button>
    </div>

    <!-- ===== LOGIN ===== -->
    <div class="section on" id="loginSec">
      <div class="err" id="lerr"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="lemail" placeholder="aapka@email.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pwd-wrap">
          <input type="password" class="form-control" id="lpwd" placeholder="Password" autocomplete="current-password"/>
          <button class="eye" onclick="toggleEye('lpwd',this)">👁️</button>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-bottom:.5rem;" onclick="doLogin()">Login Karo</button>
      <div class="forgot-link">
        <button onclick="show('forgot')">🔑 Password bhool gaye?</button>
      </div>
    </div>

    <!-- ===== SIGNUP ===== -->
    <div class="section" id="signupSec">
      <div class="err" id="serr"></div>
      <div class="suc" id="ssuc"></div>
      <div class="form-group">
        <label class="form-label">Aapka Naam</label>
        <input type="text" class="form-control" id="sname" placeholder="Poora naam" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="semail" placeholder="aapka@email.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="pwd-wrap">
          <input type="password" class="form-control" id="spwd" placeholder="Strong password banao" oninput="checkPwd(this.value)" autocomplete="new-password"/>
          <button class="eye" onclick="toggleEye('spwd',this)">👁️</button>
        </div>
        <div class="bar"><div class="bar-fill" id="pwdBar"></div></div>
        <ul class="req">
          <li id="r1">○ Kam se kam 8 characters</li>
          <li id="r2">○ Ek Capital letter (A-Z)</li>
          <li id="r3">○ Ek Number (0-9)</li>
        </ul>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="doSignup()">Account Banao</button>
    </div>

    <!-- ===== FORGOT PASSWORD ===== -->
    <div class="section" id="forgotSec">
      <button class="back-btn" onclick="show('login')">← Login pe wapas</button>
      <div style="text-align:center;margin-bottom:1.25rem;">
        <div style="font-size:2.5rem;">🔑</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;margin:.5rem 0;">Password Reset</div>
        <div style="font-size:.85rem;color:var(--text-muted);">Email aur naya password daalo</div>
      </div>
      <div class="err" id="ferr"></div>
      <div class="suc" id="fsuc"></div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="femail" placeholder="registered@email.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Naya Password</label>
        <div class="pwd-wrap">
          <input type="password" class="form-control" id="fnpwd" placeholder="Naya strong password" oninput="checkPwd(this.value,'f')"/>
          <button class="eye" onclick="toggleEye('fnpwd',this)">👁️</button>
        </div>
        <div class="bar"><div class="bar-fill" id="fBar"></div></div>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="doReset()">Password Reset Karo</button>
    </div>

  </div>
</div>

<script>
// Redirect if already logged in
var t = localStorage.getItem('kisanai_token');
if (t) {
  fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+t}})
    .then(r=>r.json()).then(d=>{ if(d.success) location.href='index.html'; }).catch(()=>{});
}

// ===== TAB SWITCH =====
function show(sec) {
  ['login','signup','forgot'].forEach(s => {
    document.getElementById(s+'Sec').classList.toggle('on', s===sec);
  });
  var tabs = document.getElementById('mainTabs');
  tabs.style.display = sec==='forgot' ? 'none' : 'flex';
  if (sec!=='forgot') {
    document.querySelectorAll('.tab').forEach((b,i) =>
      b.classList.toggle('on', (i===0&&sec==='login')||(i===1&&sec==='signup'))
    );
  }
}

// ===== UTILS =====
function showErr(id, msg) { var e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }
function showSuc(id, msg) { var e=document.getElementById(id); e.textContent=msg; e.className='suc'; e.style.display='block'; }
function hideMsg(id)       { document.getElementById(id).style.display='none'; }
function validEmail(e)     { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function toggleEye(inputId, btn) {
  var inp = document.getElementById(inputId);
  inp.type = inp.type==='password' ? 'text' : 'password';
  btn.textContent = inp.type==='password' ? '👁️' : '🙈';
}

function checkPwd(pwd, prefix) {
  var barId = prefix==='f' ? 'fBar' : 'pwdBar';
  var bar   = document.getElementById(barId);
  if (!bar) return;
  var l=pwd.length>=8, u=/[A-Z]/.test(pwd), n=/[0-9]/.test(pwd);
  var score=[l,u,n].filter(Boolean).length;
  bar.style.width=(score*33.3)+'%';
  bar.style.background=['','#f44336','#ff9800','#4caf50'][score]||'#e0e0e0';
  if (!prefix) {
    var upd=(id,ok)=>{ var el=document.getElementById(id); if(!el)return; el.className=ok?'ok':''; el.childNodes[0].textContent=ok?'✓ ':'○ '; };
    upd('r1',l); upd('r2',u); upd('r3',n);
  }
}

async function api(url, body) {
  var r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return r.json();
}

function saveAndGo(d) {
  localStorage.setItem('kisanai_token', d.token);
  localStorage.setItem('kisanai_user',  JSON.stringify(d.user));
  location.href = 'index.html';
}

// ===== SIGNUP =====
async function doSignup() {
  hideMsg('serr'); hideMsg('ssuc');
  var name  = document.getElementById('sname').value.trim();
  var email = document.getElementById('semail').value.trim().toLowerCase();
  var pwd   = document.getElementById('spwd').value;

  if (!name||!email||!pwd) { showErr('serr','Sab fields bharo'); return; }
  if (!validEmail(email))  { showErr('serr','Valid email daalo'); return; }

  var d = await api('/api/auth/signup', {name, email, password:pwd});
  if (!d.success) { showErr('serr', d.error); return; }
  saveAndGo(d);
}

// ===== LOGIN =====
async function doLogin() {
  hideMsg('lerr');
  var email = document.getElementById('lemail').value.trim().toLowerCase();
  var pwd   = document.getElementById('lpwd').value;

  if (!email||!pwd) { showErr('lerr','Email aur password daalo'); return; }

  var d = await api('/api/auth/login', {email, password:pwd});
  if (!d.success) { showErr('lerr', d.error); return; }
  saveAndGo(d);
}

// ===== FORGOT / RESET =====
async function doReset() {
  hideMsg('ferr'); hideMsg('fsuc');
  var email = document.getElementById('femail').value.trim().toLowerCase();
  var pwd   = document.getElementById('fnpwd').value;

  if (!email||!pwd) { showErr('ferr','Email aur naya password daalo'); return; }
  if (!validEmail(email)) { showErr('ferr','Valid email daalo'); return; }

  var d = await api('/api/auth/forgot-password', {email, new_password:pwd});
  if (!d.success) { showErr('ferr', d.error); return; }
  showSuc('fsuc', d.message);
  setTimeout(() => show('login'), 2500);
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('loginSec').classList.contains('on'))  doLogin();
  if (document.getElementById('signupSec').classList.contains('on')) doSignup();
  if (document.getElementById('forgotSec').classList.contains('on')) doReset();
});
</script>
</body>
</html>
