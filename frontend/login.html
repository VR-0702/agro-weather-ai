<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KisanAI — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { background:var(--bg); display:flex; flex-direction:column; min-height:100vh; justify-content:center; align-items:center; padding:1rem; }
    .auth-card { background:var(--surface); border-radius:24px; box-shadow:var(--shadow-lg); border:1px solid var(--border); width:100%; max-width:440px; overflow:hidden; }
    .auth-header { background:linear-gradient(135deg,var(--green-deep),#2e7d32); padding:2.5rem 2rem; text-align:center; color:white; }
    .auth-header h1 { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; margin:0.5rem 0 0.25rem; }
    .auth-header p { opacity:0.8; font-size:0.9rem; }
    .auth-body { padding:2rem; }
    .tab-row { display:flex; border:1.5px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:1.5rem; }
    .tab-btn { flex:1; padding:0.65rem; border:none; background:transparent; font-family:'DM Sans',sans-serif; font-size:0.9rem; font-weight:600; cursor:pointer; color:var(--text-muted); transition:var(--transition); }
    .tab-btn.active { background:var(--green-mid); color:white; }
    .step { display:none; }
    .step.active { display:block; }
    .msg { border-radius:8px; padding:0.65rem 1rem; font-size:0.85rem; margin-bottom:1rem; display:none; }
    .msg.error { background:#ffebee; color:var(--red); }
    .msg.success { background:var(--green-pale); color:var(--green-deep); }
    .otp-row { display:flex; gap:0.5rem; justify-content:center; margin:1rem 0; }
    .otp-digit { width:48px; height:56px; border:2px solid var(--border); border-radius:10px; text-align:center; font-size:1.4rem; font-weight:700; font-family:'Syne',sans-serif; outline:none; transition:var(--transition); }
    .otp-digit:focus { border-color:var(--green-bright); box-shadow:0 0 0 3px rgba(76,175,80,0.15); }
    .pwd-wrap { position:relative; }
    .pwd-wrap .form-control { padding-right:2.5rem; }
    .pwd-toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1rem; color:var(--text-muted); }
    .strength-bar { height:4px; border-radius:99px; background:var(--border); margin-top:6px; overflow:hidden; }
    .strength-fill { height:100%; border-radius:99px; transition:all 0.3s; }
    .strength-label { font-size:0.72rem; margin-top:3px; font-weight:600; }
    .resend-row { text-align:center; font-size:0.82rem; color:var(--text-muted); margin-top:0.75rem; }
    .resend-btn { color:var(--green-mid); cursor:pointer; font-weight:600; border:none; background:none; }
    .resend-btn:disabled { color:var(--text-muted); cursor:default; }
    .back-link { display:flex; align-items:center; gap:4px; color:var(--text-muted); font-size:0.85rem; cursor:pointer; margin-bottom:1rem; border:none; background:none; }
    .back-link:hover { color:var(--green-mid); }
    .divider { text-align:center; color:var(--text-muted); font-size:0.8rem; margin:1rem 0; position:relative; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:40%; height:1px; background:var(--border); }
    .divider::before { left:0; } .divider::after { right:0; }
    .requirements li { font-size:0.78rem; color:var(--text-muted); margin:2px 0; list-style:none; display:flex; align-items:center; gap:4px; }
    .req-ok { color:var(--green-mid); }
    .req-fail { color:var(--text-muted); }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div style="font-size:3rem;">🌱</div>
    <h1>KisanAI</h1>
    <p>Smart Agriculture Assistant</p>
  </div>

  <div class="auth-body">
    <!-- TABS -->
    <div class="tab-row" id="mainTabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- ===== LOGIN FLOW ===== -->
    <div id="loginFlow">
      <!-- Step 1: Login form -->
      <div class="step active" id="loginStep1">
        <div class="msg error" id="loginErr"></div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="aapka@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="pwd-wrap">
            <input type="password" class="form-control" id="loginPassword" placeholder="Password daalo" autocomplete="current-password" />
            <button class="pwd-toggle" onclick="togglePwd('loginPassword', this)">👁️</button>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-bottom:0.75rem;" onclick="doLogin()">Login karo</button>
        <div style="text-align:center;">
          <button class="back-link" onclick="showForgot()" style="display:inline-flex;">🔑 Password bhool gaye?</button>
        </div>
      </div>

      <!-- Step 2: Verify email OTP (if unverified) -->
      <div class="step" id="loginStep2">
        <button class="back-link" onclick="goToStep('loginFlow','loginStep1')">← Wapas</button>
        <div class="msg success" id="loginOtpSent">OTP bheja gaya!</div>
        <div style="text-align:center;margin-bottom:1rem;">
          <div style="font-size:2rem;">📧</div>
          <div style="font-family:'Syne',sans-serif;font-weight:700;margin:0.5rem 0;">Email Verify Karo</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" id="loginOtpEmail"></div>
        </div>
        <div class="msg error" id="loginOtpErr"></div>
        <div class="otp-row" id="loginOtpRow"></div>
        <button class="btn btn-primary" style="width:100%;" onclick="doVerifyEmail('login')">Verify Karo</button>
        <div class="resend-row">OTP nahi aaya? <button class="resend-btn" id="loginResendBtn" onclick="resendOtp('verify', 'login')">Dobara bhejo</button> <span id="loginResendTimer"></span></div>
      </div>
    </div>

    <!-- ===== SIGNUP FLOW ===== -->
    <div id="signupFlow" style="display:none;">
      <!-- Step 1: Details -->
      <div class="step active" id="signupStep1">
        <div class="msg error" id="signupErr"></div>
        <div class="form-group">
          <label class="form-label">Aapka Naam</label>
          <input type="text" class="form-control" id="signupName" placeholder="Poora naam" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="signupEmail" placeholder="aapka@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="pwd-wrap">
            <input type="password" class="form-control" id="signupPassword" placeholder="Strong password" oninput="checkStrength(this.value)" autocomplete="new-password" />
            <button class="pwd-toggle" onclick="togglePwd('signupPassword',this)">👁️</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
          <ul class="requirements" id="pwdReqs" style="margin-top:0.5rem;padding:0;">
            <li id="req-len"><span>○</span> Kam se kam 8 characters</li>
            <li id="req-upper"><span>○</span> Ek bada letter (A-Z)</li>
            <li id="req-num"><span>○</span> Ek number (0-9)</li>
          </ul>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doSignup()">Account Banao</button>
      </div>

      <!-- Step 2: OTP Verify -->
      <div class="step" id="signupStep2">
        <div style="text-align:center;margin-bottom:1.25rem;">
          <div style="font-size:2.5rem;">📬</div>
          <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;margin:0.5rem 0;">Email Check Karo!</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">OTP bheja gaya hai:</div>
          <div style="font-weight:700;color:var(--green-mid);margin-top:3px;" id="signupOtpEmail"></div>
        </div>
        <div class="msg error" id="signupOtpErr"></div>
        <div class="otp-row" id="signupOtpRow"></div>
        <button class="btn btn-primary" style="width:100%;margin-bottom:0.75rem;" onclick="doVerifyEmail('signup')">Verify Karo & Login</button>
        <div class="resend-row">OTP nahi aaya? <button class="resend-btn" id="signupResendBtn" onclick="resendOtp('verify','signup')">Dobara bhejo</button> <span id="signupResendTimer"></span></div>
      </div>
    </div>

    <!-- ===== FORGOT PASSWORD FLOW ===== -->
    <div id="forgotFlow" style="display:none;">
      <!-- Step 1: Email -->
      <div class="step active" id="forgotStep1">
        <button class="back-link" onclick="showLogin()">← Login pe wapas</button>
        <div style="text-align:center;margin-bottom:1rem;">
          <div style="font-size:2rem;">🔑</div>
          <div style="font-family:'Syne',sans-serif;font-weight:700;margin:0.5rem 0;">Password Reset</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">Email daalo, OTP bhejenge</div>
        </div>
        <div class="msg error" id="forgotErr"></div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="forgotEmail" placeholder="registered@email.com" />
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doForgot()">OTP Bhejo</button>
      </div>

      <!-- Step 2: OTP + New Password -->
      <div class="step" id="forgotStep2">
        <div style="text-align:center;margin-bottom:1rem;">
          <div style="font-size:2rem;">🔐</div>
          <div style="font-family:'Syne',sans-serif;font-weight:700;margin:0.5rem 0;">Naya Password Set Karo</div>
        </div>
        <div class="msg error" id="resetErr"></div>
        <div class="msg success" id="resetSuccess"></div>
        <label class="form-label">OTP (Email se)</label>
        <div class="otp-row" id="forgotOtpRow"></div>
        <div class="form-group" style="margin-top:1rem;">
          <label class="form-label">Naya Password</label>
          <div class="pwd-wrap">
            <input type="password" class="form-control" id="newPassword" placeholder="Naya strong password" oninput="checkStrength(this.value,'new')" />
            <button class="pwd-toggle" onclick="togglePwd('newPassword',this)">👁️</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="newStrengthFill"></div></div>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doResetPassword()">Password Reset Karo</button>
        <div class="resend-row"><button class="resend-btn" id="forgotResendBtn" onclick="resendOtp('reset','forgot')">OTP dobara bhejo</button> <span id="forgotResendTimer"></span></div>
      </div>
    </div>

  </div><!-- auth-body -->
</div><!-- auth-card -->

<script>
var currentEmail = '';
var resendTimers = {};

// ===== REDIRECT IF LOGGED IN =====
if (localStorage.getItem('kisanai_token')) {
  fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + localStorage.getItem('kisanai_token') } })
    .then(r => r.json()).then(d => { if (d.success) window.location.href = 'index.html'; })
    .catch(() => {});
}

// ===== OTP INPUT BOXES =====
function createOtpBoxes(containerId) {
  var el = document.getElementById(containerId);
  el.innerHTML = '';
  for (var i = 0; i < 6; i++) {
    var inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 1; inp.className = 'otp-digit';
    inp.dataset.idx = i;
    inp.addEventListener('input', function(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value && e.target.nextElementSibling) e.target.nextElementSibling.focus();
    });
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling)
        e.target.previousElementSibling.focus();
    });
    inp.addEventListener('paste', function(e) {
      e.preventDefault();
      var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,6);
      var boxes = e.target.parentElement.querySelectorAll('.otp-digit');
      paste.split('').forEach((c, i) => { if (boxes[i]) boxes[i].value = c; });
      if (boxes[paste.length]) boxes[paste.length].focus();
    });
    el.appendChild(inp);
  }
}

function getOtpValue(containerId) {
  return Array.from(document.getElementById(containerId).querySelectorAll('.otp-digit')).map(i => i.value).join('');
}

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('loginFlow').style.display   = tab==='login'  ? 'block' : 'none';
  document.getElementById('signupFlow').style.display  = tab==='signup' ? 'block' : 'none';
  document.getElementById('forgotFlow').style.display  = 'none';
  document.getElementById('mainTabs').style.display    = 'flex';
}

function showForgot() {
  document.getElementById('loginFlow').style.display  = 'none';
  document.getElementById('signupFlow').style.display = 'none';
  document.getElementById('forgotFlow').style.display = 'block';
  document.getElementById('mainTabs').style.display   = 'none';
  goToStep('forgotFlow', 'forgotStep1');
  createOtpBoxes('forgotOtpRow');
}

function showLogin() {
  document.getElementById('mainTabs').style.display   = 'flex';
  document.getElementById('forgotFlow').style.display = 'none';
  document.getElementById('loginFlow').style.display  = 'block';
  goToStep('loginFlow', 'loginStep1');
}

function goToStep(flow, stepId) {
  document.getElementById(flow).querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

// ===== UTILS =====
function showMsg(id, text, type) {
  var el = document.getElementById(id);
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
  if (type === 'success') setTimeout(() => el.style.display='none', 4000);
}

function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

function togglePwd(inputId, btn) {
  var inp = document.getElementById(inputId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

// ===== PASSWORD STRENGTH =====
function checkStrength(pwd, prefix) {
  prefix = prefix || '';
  var fillId  = prefix ? prefix+'StrengthFill' : 'strengthFill';
  var labelId = prefix ? null : 'strengthLabel';
  var fill    = document.getElementById(fillId);
  if (!fill) return;

  var score = 0;
  var hasLen   = pwd.length >= 8;
  var hasUpper = /[A-Z]/.test(pwd);
  var hasNum   = /[0-9]/.test(pwd);
  var hasSpec  = /[^A-Za-z0-9]/.test(pwd);

  if (hasLen)   score++;
  if (hasUpper) score++;
  if (hasNum)   score++;
  if (hasSpec)  score++;

  var colors = ['#f44336','#ff9800','#ffc107','#4caf50'];
  var labels = ['Bahut kamzor','Kamzor','Theek hai','Strong! 💪'];
  fill.style.width  = (score * 25) + '%';
  fill.style.background = colors[score-1] || '#e0e0e0';
  if (labelId) {
    var lbl = document.getElementById(labelId);
    lbl.textContent = score ? labels[score-1] : '';
    lbl.style.color = colors[score-1] || '#999';
  }

  // Update requirements
  var updateReq = (id, ok) => {
    var el = document.getElementById(id);
    if (!el) return;
    el.querySelector('span').textContent = ok ? '✓' : '○';
    el.className = ok ? 'req-ok' : 'req-fail';
  };
  updateReq('req-len',   hasLen);
  updateReq('req-upper', hasUpper);
  updateReq('req-num',   hasNum);
}

// ===== RESEND TIMER =====
function startResendTimer(btnId, timerId, seconds) {
  var btn   = document.getElementById(btnId);
  var timer = document.getElementById(timerId);
  btn.disabled = true;
  var left = seconds;
  var iv = setInterval(function() {
    left--;
    timer.textContent = '(' + left + 's)';
    if (left <= 0) {
      clearInterval(iv);
      btn.disabled = false;
      timer.textContent = '';
    }
  }, 1000);
}

// ===== API CALLS =====
async function api(url, body) {
  var res  = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return res.json();
}

// ===== SIGNUP =====
async function doSignup() {
  var name  = document.getElementById('signupName').value.trim();
  var email = document.getElementById('signupEmail').value.trim().toLowerCase();
  var pwd   = document.getElementById('signupPassword').value;

  if (!name || !email || !pwd) { showMsg('signupErr', 'Sab fields bharo', 'error'); return; }
  if (!isValidEmail(email))    { showMsg('signupErr', 'Email valid nahi hai', 'error'); return; }

  var d = await api('/api/auth/signup', { name, email, password: pwd });
  if (!d.success) { showMsg('signupErr', d.error, 'error'); return; }

  currentEmail = email;
  document.getElementById('signupOtpEmail').textContent = email;
  createOtpBoxes('signupOtpRow');
  goToStep('signupFlow', 'signupStep2');
  startResendTimer('signupResendBtn', 'signupResendTimer', 60);
}

// ===== LOGIN =====
async function doLogin() {
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  var pwd   = document.getElementById('loginPassword').value;

  if (!email || !pwd) { showMsg('loginErr', 'Email aur password chahiye', 'error'); return; }

  var d = await api('/api/auth/login', { email, password: pwd });
  if (d.needs_verification) {
    currentEmail = email;
    document.getElementById('loginOtpEmail').textContent = email;
    document.getElementById('loginOtpSent').style.display = 'block';
    createOtpBoxes('loginOtpRow');
    goToStep('loginFlow', 'loginStep2');
    startResendTimer('loginResendBtn', 'loginResendTimer', 60);
    return;
  }
  if (!d.success) { showMsg('loginErr', d.error, 'error'); return; }

  saveAndRedirect(d);
}

// ===== VERIFY EMAIL =====
async function doVerifyEmail(flow) {
  var rowId  = flow === 'login' ? 'loginOtpRow' : 'signupOtpRow';
  var errId  = flow === 'login' ? 'loginOtpErr' : 'signupOtpErr';
  var otp    = getOtpValue(rowId);

  if (otp.length !== 6) { showMsg(errId, '6 digit OTP daalo', 'error'); return; }

  var d = await api('/api/auth/verify-email', { email: currentEmail, otp });
  if (!d.success) { showMsg(errId, d.error, 'error'); return; }

  saveAndRedirect(d);
}

// ===== FORGOT PASSWORD =====
async function doForgot() {
  var email = document.getElementById('forgotEmail').value.trim().toLowerCase();
  if (!email || !isValidEmail(email)) { showMsg('forgotErr', 'Valid email daalo', 'error'); return; }

  var d = await api('/api/auth/forgot-password', { email });
  if (!d.success) { showMsg('forgotErr', d.error, 'error'); return; }

  currentEmail = email;
  goToStep('forgotFlow', 'forgotStep2');
  startResendTimer('forgotResendBtn', 'forgotResendTimer', 60);
}

async function doResetPassword() {
  var otp  = getOtpValue('forgotOtpRow');
  var pwd  = document.getElementById('newPassword').value;

  if (otp.length !== 6) { showMsg('resetErr', '6 digit OTP daalo', 'error'); return; }
  if (pwd.length < 8)   { showMsg('resetErr', 'Password kam se kam 8 characters ka hona chahiye', 'error'); return; }

  var d = await api('/api/auth/reset-password', { email: currentEmail, otp, new_password: pwd });
  if (!d.success) { showMsg('resetErr', d.error, 'error'); return; }

  showMsg('resetSuccess', d.message + ' Login karo.', 'success');
  setTimeout(() => showLogin(), 2500);
}

// ===== RESEND OTP =====
async function resendOtp(type, flow) {
  var d = await api('/api/auth/resend-otp', { email: currentEmail, type });
  var timers = { login:['loginResendBtn','loginResendTimer'], signup:['signupResendBtn','signupResendTimer'], forgot:['forgotResendBtn','forgotResendTimer'] };
  if (timers[flow]) startResendTimer(timers[flow][0], timers[flow][1], 60);
  if (!d.success) console.error(d.error);
}

// ===== SAVE & REDIRECT =====
function saveAndRedirect(d) {
  localStorage.setItem('kisanai_token', d.token);
  localStorage.setItem('kisanai_user',  JSON.stringify(d.user));
  window.location.href = 'index.html';
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  var activeStep = document.querySelector('.step.active');
  if (!activeStep) return;
  if (activeStep.id === 'loginStep1')   doLogin();
  if (activeStep.id === 'signupStep1')  doSignup();
  if (activeStep.id === 'forgotStep1')  doForgot();
  if (activeStep.id === 'forgotStep2')  doResetPassword();
});
</script>
</body>
</html>
